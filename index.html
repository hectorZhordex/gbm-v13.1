<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Internal Server Error | UniPOS</title>
<meta name="robots" content="noindex">
<style>
  /* ==========================================================================
     CSS VARIABLES — central theme controls for easy customization
     ========================================================================== */
  :root{
    --bg-base:#06070a;
    --bg-alt:#0b0d13;
    --accent:#7c9cff;
    --accent-2:#ff6b6b;
    --accent-soft: rgba(124,156,255,0.35);
    --text-primary:#eef1f8;
    --text-secondary:#a2a9bd;
    --text-muted:#6a7086;
    --glass-bg: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.09);
    --glass-highlight: rgba(255,255,255,0.06);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --shadow-glow: 0 0 80px rgba(124,156,255,0.15);
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    --transition-fast: 0.18s cubic-bezier(.4,0,.2,1);
    --transition-med: 0.4s cubic-bezier(.4,0,.2,1);
  }

  /* ==========================================================================
     RESET & BASE
     ========================================================================== */
  *, *::before, *::after{ box-sizing:border-box; }
  html, body{
    height:100%;
    margin:0;
    padding:0;
  }
  body{
    font-family:var(--font-main);
    background:var(--bg-base);
    color:var(--text-primary);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{ background:var(--accent-soft); color:#fff; }

  a{ color:inherit; }

  /* ==========================================================================
     BACKGROUND LAYERS — gradient glow + grid + particles
     ========================================================================== */
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  /* Moving gradient glow */
  .bg-glow{
    position:fixed;
    inset:-20%;
    z-index:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(124,156,255,0.16), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,107,107,0.10), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(124,156,255,0.06), transparent 60%);
    filter:blur(40px);
    animation: driftGlow 22s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes driftGlow{
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(3%, -2%) scale(1.08); }
    100% { transform: translate(-3%, 2%) scale(1.02); }
  }

  /* Subtle grid pattern */
  .bg-grid{
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9) 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9) 0%, transparent 75%);
  }

  /* Floating particles */
  .particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--accent);
    opacity:0.5;
    box-shadow:0 0 8px 1px var(--accent-soft);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%   { transform:translateY(0) translateX(0); opacity:0; }
    10%  { opacity:0.6; }
    90%  { opacity:0.4; }
    100% { transform:translateY(-110vh) translateX(20px); opacity:0; }
  }

  /* ==========================================================================
     LAYOUT
     ========================================================================== */
  .wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px 20px;
    text-align:center;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.08em;
    color:var(--text-secondary);
    text-transform:uppercase;
    margin-bottom:28px;
    opacity:0.9;
  }
  .brand .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px 2px var(--accent-soft);
    flex-shrink:0;
  }

  /* ==========================================================================
     ILLUSTRATION — glowing server rack with error indicator + connection lines
     ========================================================================== */
  .illustration{
    width:180px;
    height:180px;
    margin-bottom: 8px;
    position:relative;
  }
  .illustration svg{ width:100%; height:100%; overflow:visible; }

  .server-glow-bg{
    filter: drop-shadow(0 0 18px rgba(124,156,255,0.35));
  }

  .server-rack{
    animation: rackFloat 5s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes rackFloat{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-6px); }
  }

  .server-led{
    animation: ledBlink 2.4s ease-in-out infinite;
  }
  .server-led.led-2{ animation-delay:0.4s; }
  .server-led.led-3{ animation-delay:0.8s; }
  @keyframes ledBlink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }

  .conn-line{
    stroke-dasharray: 6 8;
    animation: dashMove 2.6s linear infinite;
    opacity:0.55;
  }
  @keyframes dashMove{
    to{ stroke-dashoffset:-140; }
  }

  .error-pulse{
    animation: pulseRing 2.2s ease-out infinite;
    transform-origin:center;
  }
  @keyframes pulseRing{
    0%{ transform:scale(0.85); opacity:0.9; }
    80%{ transform:scale(1.6); opacity:0; }
    100%{ transform:scale(1.6); opacity:0; }
  }

  .error-mark{
    animation: warnPop 2.4s ease-in-out infinite;
  }
  @keyframes warnPop{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }

  .particle-dot{
    animation: dotDrift 4s ease-in-out infinite;
  }
  @keyframes dotDrift{
    0%,100%{ transform:translate(0,0); opacity:0.3; }
    50%{ transform:translate(4px,-6px); opacity:0.9; }
  }

  /* ==========================================================================
     TYPOGRAPHY — 500 code + heading + description
     ========================================================================== */
  .code-number{
    font-size:clamp(64px, 16vw, 128px);
    font-weight:800;
    line-height:1;
    letter-spacing:-0.03em;
    margin:0;
    background:linear-gradient(180deg, #ffffff 0%, var(--accent) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 30px rgba(124,156,255,0.25));
    position:relative;
  }

  h1.title{
    font-size:clamp(20px, 4vw, 28px);
    font-weight:700;
    margin: 6px 0 14px;
    color:var(--text-primary);
    letter-spacing:-0.01em;
  }

  p.description{
    font-size:clamp(14px, 2vw, 16px);
    color:var(--text-secondary);
    max-width:440px;
    line-height:1.6;
    margin:0 0 34px;
  }

  /* ==========================================================================
     GLASS CARD — wraps content for glassmorphism effect
     ========================================================================== */
  .glass-card{
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    padding:clamp(28px, 5vw, 52px) clamp(20px, 6vw, 60px);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: var(--shadow-glow), inset 0 1px 0 var(--glass-highlight);
    max-width:600px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }

  /* ==========================================================================
     BUTTONS
     ========================================================================== */
  .actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
  }

  .btn{
    appearance:none;
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:14px 30px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
    text-decoration:none;
    line-height:1;
    min-width:170px;
    justify-content:center;
  }
  .btn:active{ transform:translateY(1px) scale(0.98); }

  .btn-primary{
    background:linear-gradient(180deg, #8fa8ff, var(--accent));
    color:#0a0c12;
    box-shadow:0 6px 20px rgba(124,156,255,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .btn-primary:hover{
    box-shadow:0 8px 26px rgba(124,156,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
    transform:translateY(-2px);
  }

  .btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  /* ==========================================================================
     FOOTER
     ========================================================================== */
  .footer{
    position:relative;
    z-index:2;
    margin-top:26px;
    font-size:12.5px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;
    text-align:center;
    max-width:520px;
    line-height:1.5;
  }

  /* ==========================================================================
     RESPONSIVE
     ========================================================================== */
  @media (max-width:480px){
    .illustration{ width:130px; height:130px; }
    .actions{ flex-direction:column; }
    .btn{ width:100%; }
    .glass-card{ padding:32px 22px; }
  }

  @media (max-height:640px){
    .illustration{ width:110px; height:110px; margin-bottom:0; }
    .glass-card{ padding:26px 24px; }
    p.description{ margin-bottom:22px; }
  }

  /* ==========================================================================
     ACCESSIBILITY — respect reduced motion preference
     ========================================================================== */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    .bg-glow, .particle, .server-rack, .server-led, .conn-line, .error-pulse, .error-mark, .particle-dot{
      animation:none !important;
    }
  }
</style>
</head>
<body>

  <!-- ============================================================
       BACKGROUND: gradient glow + grid overlay + floating particles
       ============================================================ -->
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-layer bg-grid" aria-hidden="true"></div>
  <div class="bg-layer" id="particles" aria-hidden="true"></div>

  <!-- ============================================================
       MAIN CONTENT
       ============================================================ -->
  <main class="wrap" role="main">

    <div class="brand" aria-hidden="true">
      <span class="dot"></span>
      <span>UniPOS</span>
    </div>

    <section class="glass-card">

      <!-- Illustration: server rack with pulse error indicator -->
      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 200 200" class="server-glow-bg" xmlns="http://www.w3.org/2000/svg">
          <!-- connection lines -->
          <line class="conn-line" x1="20" y1="60" x2="70" y2="60" stroke="var(--accent)" stroke-width="2"/>
          <line class="conn-line" x1="130" y1="60" x2="180" y2="60" stroke="var(--accent)" stroke-width="2"/>
          <line class="conn-line" x1="20" y1="140" x2="70" y2="140" stroke="var(--accent)" stroke-width="2"/>
          <line class="conn-line" x1="130" y1="140" x2="180" y2="140" stroke="var(--accent)" stroke-width="2"/>

          <!-- floating particle dots -->
          <circle class="particle-dot" cx="30" cy="40" r="2" fill="var(--accent)"/>
          <circle class="particle-dot" cx="175" cy="100" r="2.4" fill="var(--accent)" style="animation-delay:0.8s"/>
          <circle class="particle-dot" cx="35" cy="165" r="2" fill="var(--accent-2)" style="animation-delay:1.4s"/>

          <!-- server rack group -->
          <g class="server-rack">
            <rect x="70" y="45" width="60" height="110" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

            <!-- server unit rows -->
            <rect x="80" y="58" width="40" height="18" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
            <circle class="server-led" cx="88" cy="67" r="2.4" fill="var(--accent)"/>
            <rect x="96" y="64" width="18" height="2.4" rx="1.2" fill="rgba(255,255,255,0.25)"/>

            <rect x="80" y="82" width="40" height="18" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
            <circle class="server-led led-2" cx="88" cy="91" r="2.4" fill="var(--accent)"/>
            <rect x="96" y="88" width="18" height="2.4" rx="1.2" fill="rgba(255,255,255,0.25)"/>

            <rect x="80" y="106" width="40" height="18" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
            <circle class="server-led led-3" cx="88" cy="115" r="2.4" fill="var(--accent-2)"/>
            <rect x="96" y="112" width="18" height="2.4" rx="1.2" fill="rgba(255,255,255,0.25)"/>

            <rect x="80" y="130" width="40" height="14" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
          </g>

          <!-- error pulse rings -->
          <circle class="error-pulse" cx="140" cy="45" r="12" fill="none" stroke="var(--accent-2)" stroke-width="2"/>

          <!-- warning triangle -->
          <g class="error-mark" transform="translate(140,45)">
            <circle r="13" fill="var(--bg-alt)" stroke="var(--accent-2)" stroke-width="2"/>
            <path d="M0,-6 L5.5,5 L-5.5,5 Z" fill="none" stroke="var(--accent-2)" stroke-width="1.8" stroke-linejoin="round"/>
            <rect x="-0.7" y="-3" width="1.4" height="4.5" fill="var(--accent-2)"/>
            <circle cx="0" cy="3.3" r="0.9" fill="var(--accent-2)"/>
          </g>
        </svg>
      </div>

      <!-- Error code, heading, description -->
      <p class="code-number" aria-hidden="true">500</p>
      <h1 class="title" id="error-title">Internal Server Error</h1>
      <p class="description">
        Something went wrong on our server. We're working to get things back to normal.
      </p>

      <!-- Action button -->
      <div class="actions">
        <button type="button" class="btn btn-primary" id="retryBtn" aria-label="Reload this page">
          Try Again
        </button>
      </div>

    </section>

    <!-- ============================================================
         FOOTER
         ============================================================ -->
    <footer class="footer">
      <div>© 2026 UniPOS. All Rights Reserved. Subsidiary of DotcomOne</div>
    </footer>

  </main>

  <!-- ============================================================
       JAVASCRIPT — Try Again reload + particle generation
       ============================================================ -->
  <script>
    (function(){
      "use strict";

      // Reload current page (refresh the site) on "Try Again" click
      var retryBtn = document.getElementById('retryBtn');
      retryBtn.addEventListener('click', function(){
        window.location.href = 'https://opendb.courseocean.us';
      });

      // Respect reduced motion preference before generating particles
      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!prefersReducedMotion) {
        var container = document.getElementById('particles');
        var count = window.innerWidth < 600 ? 14 : 26;

        for (var i = 0; i < count; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          var left = Math.random() * 100;
          var size = (Math.random() * 2 + 1.5).toFixed(1);
          var duration = (Math.random() * 10 + 10).toFixed(1);
          var delay = (Math.random() * 10).toFixed(1);

          p.style.left = left + 'vw';
          p.style.bottom = '-10px';
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.animationDuration = duration + 's';
          p.style.animationDelay = delay + 's';

          container.appendChild(p);
        }
      }
    })();
  </script>

</body>
</html>
