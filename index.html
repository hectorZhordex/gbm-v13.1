<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Paused</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #000000;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    text-align: center;
    padding: 24px;
    position: relative;
  }

  .message {
    font-size: clamp(14px, 2.5vw, 20px);
    font-weight: 400;
    color: #f5f5f5;
    letter-spacing: 0.2px;
  }

  .footer-id {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: clamp(10px, 1.5vw, 12px);
    color: #4a4a4a;
    padding: 0 16px;
    word-break: break-all;
  }

  @media (max-width: 480px) {
    .footer-id {
      bottom: 24px;
    }
  }
</style>
</head>
<body>
  <div class="message">This deployment is temporarily paused</div>
  <div class="footer-id" id="requestId">bom1::twbwc-1788417244853-a56bf699d622</div>

  <script>
    // Optional: generate a fresh-looking request id each load for realism
    (function () {
      const regions = ["bom1", "iad1", "sfo1", "fra1", "hnd1", "syd1"];
      const region = regions[Math.floor(Math.random() * regions.length)];
      const rand = () => Math.random().toString(16).slice(2, 8);
      const ts = Date.now();
      document.getElementById("requestId").textContent =
        `${region}::${rand()}-${ts}-${rand()}${rand().slice(0, 4)}`;
    })();
  </script>
</body>
</html>
